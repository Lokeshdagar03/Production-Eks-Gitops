stages:
  - test
  - security
  - build
  - push

variables:
  AWS_REGION: "ap-south-1"
  ECR_REPOSITORY: "production-eks-app"
  ECR_REGISTRY: "538774546514.dkr.ecr.ap-south-1.amazonaws.com"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE_NAME: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

test:
  stage: test
  image: node:22-alpine
  script:
    - cd app
    - npm ci
    - npm test --if-present

trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL app/

docker_build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t "$IMAGE_NAME" ./app

push_to_ecr:
  stage: push
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli
    - export AWS_ROLE_ARN="arn:aws:iam::538774546514:role/GitLab-Production-EKS-ECR"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/gitlab-oidc-token"
    - echo "$AWS_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME" ./app
    - docker push "$IMAGE_NAME"
