name: Production EKS CI/CD

on:
  push:
    branches:
      - production-v2

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 538774546514.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: production-eks-app

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test --if-present

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: 0

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::538774546514:role/GitHub-Production-EKS-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME" \
            ./app

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME"

      - name: Update Kubernetes manifest
        run: |
          sed -i "s#image: .*#image: ${IMAGE_NAME}#" k8s/deployment.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "Update production app image to ${IMAGE_TAG}"
            git push
          fi
