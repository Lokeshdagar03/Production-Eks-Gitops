apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-eks-app
  namespace: production-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-eks-app
  template:
    metadata:
      labels:
        app: production-eks-app
    spec:
      containers:
        - name: production-eks-app
          image: 538774546514.dkr.ecr.ap-south-1.amazonaws.com/production-eks-app:a27ecb9
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
